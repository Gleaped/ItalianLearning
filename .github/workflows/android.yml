name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.signed.outputs.signed }}
    timeout-minutes: 45
    env:
      VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Check Android SDK
        # ubuntu-latest ships the Android SDK with licences accepted; AGP installs
        # any missing platform/build-tools itself.
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"

      - name: Validate course content
        run: python3 tools/validate_content.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ITALIANO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/italiano.jks"
            echo "ITALIANO_KEYSTORE_PATH=$RUNNER_TEMP/italiano.jks" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::ITALIANO_KEYSTORE_BASE64 secret not set; release APK will be unsigned and no Release is published."
            echo "SIGNED=false" >> "$GITHUB_ENV"
          fi

      - name: Unit tests, lint and release build
        env:
          ITALIANO_KEYSTORE_PASSWORD: ${{ secrets.ITALIANO_KEYSTORE_PASSWORD }}
        run: ./gradlew --stacktrace testDebugUnitTest lintDebug assembleRelease

      - name: Rename APK
        run: |
          mkdir -p dist
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$apk" ]; then echo "No release APK found"; exit 1; fi
          cp "$apk" "dist/italiano-${VERSION_NAME}.apk"
          ls -l dist

      - name: Record signing state
        id: signed
        run: echo "signed=$SIGNED" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: italiano-${{ env.VERSION_NAME }}
          path: dist/italiano-${{ env.VERSION_NAME }}.apk
          if-no-files-found: error

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

  release:
    # Obtainium watches GitHub Releases; only main produces one.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.signed == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: italiano-${{ env.VERSION_NAME }}
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Italiano ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/italiano-${{ env.VERSION_NAME }}.apk
