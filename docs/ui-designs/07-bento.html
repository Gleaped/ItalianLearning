<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,sans-serif;background:#d9d9d9;display:flex;gap:32px;justify-content:center;align-items:flex-start;padding:28px;flex-wrap:wrap}

.btn{position:absolute;bottom:18px;left:16px;right:16px;border-radius:30px;background:#7c5cff;color:#fff;text-align:center;padding:16px;font-size:19px;font-weight:700}</style></head><body><div class="cap">7. Bento — soft pastel bento grid of rounded widgets, friendly sans-serif</div>
